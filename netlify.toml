[build]
  command = "npm run build"
  publish = "dist"
  
[build.environment]
  NODE_VERSION = "20.19.0"
  NPM_FLAGS = "--legacy-peer-deps"
  CI = "true"

# Ignore kimi-plugin-inspect-react in production
[build.processing]
  skip_processing = false

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    Cross-Origin-Opener-Policy = "same-origin"
    Cross-Origin-Resource-Policy = "same-site"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com https://www.google-analytics.com https://pagead2.googlesyndication.com https://www.gstatic.com https://adservice.google.com https://*.googlesyndication.com https://*.adtrafficquality.google https://cdnjs.cloudflare.com https://www.ezojs.com https://ezoicanalytics.com https://cmp.gatekeeperconsent.com https://the.gatekeeperconsent.com https://*.ezodn.com https://*.ezoic.net https://*.ezoic.com; worker-src 'self' blob: https://cdnjs.cloudflare.com; child-src 'self' blob: data:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://*.ezoic.com https://*.ezoic.net; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https:; connect-src 'self' https://www.google-analytics.com https://pagead2.googlesyndication.com https://*.google.com https://*.googlesyndication.com https://*.adtrafficquality.google https://api.ipify.org https://*.ezoic.com https://*.ezoic.net https://*.ezodn.com https://ezoicanalytics.com https://cmp.gatekeeperconsent.com https://the.gatekeeperconsent.com; frame-src 'self' data: blob: https://googleads.g.doubleclick.net https://tpc.googlesyndication.com https://www.google.com https://*.googlesyndication.com https://*.ezoic.com https://*.ezoic.net; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Content-Type = "application/xml; charset=utf-8"
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/robots.txt"
  [headers.values]
    Content-Type = "text/plain"
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/ads.txt"
  [headers.values]
    Content-Type = "text/plain"
    Cache-Control = "public, max-age=0, must-revalidate"

# ── Dead /articles/* URLs indexed by Google → redirect to blog ─────────────
[[redirects]]
  from = "/articles/adsense-approval-guide"
  to = "/en/blog"
  status = 301

[[redirects]]
  from = "/articles/free-canva-alternatives-2026.html"
  to = "/en/blog"
  status = 301

[[redirects]]
  from = "/articles/free-canva-alternatives-2026"
  to = "/en/blog"
  status = 301

[[redirects]]
  from = "/articles/google-search-pro"
  to = "/en/blog"
  status = 301

[[redirects]]
  from = "/articles/*"
  to = "/en/blog"
  status = 301

# ── German blog URL that redirects to homepage (fix) ─────────────────────────
[[redirects]]
  from = "/de/blog/why-pdf-is-standard-for-documents"
  to = "/en/blog/ultimate-guide-optimizing-images-web"
  status = 301

[[redirects]]
  from = "/de/*"
  to = "/en/:splat"
  status = 301

# ── Legacy /rw locale redirects ──────────────────────────────────────────────
[[redirects]]
  from = "/rw"
  to = "/fr"
  status = 301

[[redirects]]
  from = "/rw/*"
  to = "/fr/:splat"
  status = 301

[[redirects]]
  from = "/"
  to = "/en"
  status = 301
  force = true

[[redirects]]
  from = "/about"
  to = "/en/about"
  status = 301

[[redirects]]
  from = "/contact"
  to = "/en/contact"
  status = 301

[[redirects]]
  from = "/privacy"
  to = "/en/privacy"
  status = 301

[[redirects]]
  from = "/terms"
  to = "/en/terms"
  status = 301

[[redirects]]
  from = "/cookies"
  to = "/en/cookies"
  status = 301

[[redirects]]
  from = "/disclaimer"
  to = "/en/disclaimer"
  status = 301

[[redirects]]
  from = "/blog"
  to = "/en/blog"
  status = 301

[[redirects]]
  from = "/blog/*"
  to = "/en/blog/:splat"
  status = 301

[[redirects]]
  from = "/tools/*"
  to = "/en/tools/:splat"
  status = 301

[[redirects]]
  from = "/category/*"
  to = "/en/category/:splat"
  status = 301

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
