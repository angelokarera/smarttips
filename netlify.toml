[build]
  command = "npm run build"
  publish = "dist"
  
[build.environment]
  NODE_VERSION = "20.19.0"
  NPM_FLAGS = "--legacy-peer-deps"
  CI = "true"

# Ignore kimi-plugin-inspect-react in production
[build.processing]
  skip_processing = false

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"

[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Content-Type = "application/xml; charset=utf-8"
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/robots.txt"
  [headers.values]
    Content-Type = "text/plain"
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/ads.txt"
  [headers.values]
    Content-Type = "text/plain"
    Cache-Control = "public, max-age=0, must-revalidate"

[[redirects]]
  from = "/rw"
  to = "/fr"
  status = 301

[[redirects]]
  from = "/rw/*"
  to = "/fr/:splat"
  status = 301

[[redirects]]
  from = "/"
  to = "/en"
  status = 301
  force = true

[[redirects]]
  from = "/about"
  to = "/en/about"
  status = 301

[[redirects]]
  from = "/contact"
  to = "/en/contact"
  status = 301

[[redirects]]
  from = "/privacy"
  to = "/en/privacy"
  status = 301

[[redirects]]
  from = "/terms"
  to = "/en/terms"
  status = 301

[[redirects]]
  from = "/cookies"
  to = "/en/cookies"
  status = 301

[[redirects]]
  from = "/disclaimer"
  to = "/en/disclaimer"
  status = 301

[[redirects]]
  from = "/blog"
  to = "/en/blog"
  status = 301

[[redirects]]
  from = "/blog/*"
  to = "/en/blog/:splat"
  status = 301

[[redirects]]
  from = "/tools/*"
  to = "/en/tools/:splat"
  status = 301

[[redirects]]
  from = "/category/*"
  to = "/en/category/:splat"
  status = 301

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
